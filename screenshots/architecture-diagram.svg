<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="gFE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="gBE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="gDB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
    .title { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 12px; font-weight: 600; fill: #64748b; }
    .item { font-size: 12px; fill: #334155; }
    .deploy { font-size: 11.5px; font-weight: 700; fill: #7c3aed; }
    .wire { stroke: #64748b; stroke-width: 2; fill: none; }
    .wireLabel { font-size: 12px; font-weight: 700; fill: #334155; }
    .wireSub { font-size: 10.5px; fill: #64748b; }
    .svcTitle { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .svcSub { font-size: 10px; fill: #64748b; }
  </style>

  <!-- ══ FRONTEND (KANFLOW WEB) ══ -->
  <g transform="translate(30,50)">
    <rect class="box" width="300" height="400" rx="14" fill="url(#gFE)"/>
    <text x="150" y="32" text-anchor="middle" class="title">🖥️ Kanflow Web (React 18)</text>
    <text x="150" y="50" text-anchor="middle" class="subtitle">Frontend SPA — deployed on Vercel</text>
    <g transform="translate(20,68)">
      <rect width="260" height="42" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="17" class="item" font-weight="700">Redux Toolkit + Persist</text>
      <text x="14" y="33" class="svcSub">Predictable state &amp; auth rehydration</text>
    </g>
    <g transform="translate(20,118)">
      <rect width="260" height="42" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="17" class="item" font-weight="700">@dnd-kit Drag &amp; Drop</text>
      <text x="14" y="33" class="svcSub">Fluid columns &amp; cards reordering</text>
    </g>
    <g transform="translate(20,168)">
      <rect width="260" height="42" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="17" class="item" font-weight="700">Axios Interceptors (Dual-Auth)</text>
      <text x="14" y="33" class="svcSub">Silent JWT refresh queue &amp; replay</text>
    </g>
    <g transform="translate(20,218)">
      <rect width="260" height="42" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="17" class="item" font-weight="700">Socket.IO Client</text>
      <text x="14" y="33" class="svcSub">Real-time room board:&lt;id&gt; presence</text>
    </g>
    <g transform="translate(20,268)">
      <rect width="260" height="46" rx="9" fill="#ffffff" stroke="#c084fc"/>
      <text x="14" y="18" class="item" font-weight="700" fill="#7c3aed">🤖 Kanflow Assistant Widget</text>
      <text x="14" y="34" class="svcSub">Multimodal Ctrl+V &amp; localStorage history</text>
    </g>
    <g transform="translate(20,322)">
      <rect width="260" height="40" rx="9" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="14" y="17" class="item" font-weight="700">PWA &amp; Material UI v5</text>
      <text x="14" y="31" class="svcSub">Dark/Light theme &amp; responsive UI</text>
    </g>
    <text x="150" y="388" text-anchor="middle" class="deploy">▲ Vercel · CI: GitHub Actions</text>
  </g>

  <!-- ══ WIRES FE → BE ══ -->
  <g>
    <path class="wire" d="M 336 170 C 400 170, 430 190, 492 190" marker-end="url(#arrowBlue)"/>
    <text x="412" y="160" text-anchor="middle" class="wireLabel" fill="#2563eb">REST /v1</text>
    <text x="412" y="208" text-anchor="middle" class="wireSub">42+ endpoints · Dual-Auth</text>

    <path class="wire" stroke="#0ea5e9" stroke-dasharray="7 5" d="M 336 290 C 400 290, 430 270, 492 270" marker-end="url(#arrow)"/>
    <text x="412" y="312" text-anchor="middle" class="wireLabel" fill="#0ea5e9">WebSocket</text>
    <text x="412" y="260" text-anchor="middle" class="wireSub">Socket.IO room board:&lt;id&gt;</text>
    <text x="412" y="276" text-anchor="middle" class="wireSub">Instant sync &amp; alerts</text>
  </g>

  <!-- ══ BACKEND (KANFLOW API) ══ -->
  <g transform="translate(498,50)">
    <rect class="box" width="310" height="400" rx="14" fill="url(#gBE)"/>
    <text x="155" y="32" text-anchor="middle" class="title">⚙️ Kanflow API (Node.js)</text>
    <text x="155" y="50" text-anchor="middle" class="subtitle">REST API + Socket.IO — deployed on Render</text>
    <g transform="translate(20,68)">
      <rect width="270" height="42" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="14" y="17" class="item" font-weight="700">🔐 Dual-Auth + Token Rotation</text>
      <text x="14" y="33" class="svcSub">HttpOnly cookies + Bearer token fallback</text>
    </g>
    <g transform="translate(20,118)">
      <rect width="270" height="42" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="14" y="17" class="item" font-weight="700">🛡️ Joi Validation + Rate Limiter</text>
      <text x="14" y="33" class="svcSub">Strict payload check &amp; IDOR guards</text>
    </g>
    <g transform="translate(20,168)">
      <rect width="270" height="44" rx="9" fill="#ffffff" stroke="#c084fc"/>
      <text x="14" y="18" class="item" font-weight="700" fill="#7c3aed">🤖 Gemini 2.5 Flash Lite Provider</text>
      <text x="14" y="34" class="svcSub">Board context injection &amp; multimodal vision</text>
    </g>
    <g transform="translate(20,220)">
      <rect width="270" height="42" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="14" y="17" class="item" font-weight="700">🧪 node:test Suites (51 tests)</text>
      <text x="14" y="33" class="svcSub">IDOR, rotation, socket, validation</text>
    </g>
    <g transform="translate(20,270)">
      <rect width="270" height="42" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="14" y="17" class="item" font-weight="700">🔁 Socket.IO Server Engine</text>
      <text x="14" y="33" class="svcSub">Presence, invites, card moves, deadlines</text>
    </g>
    <g transform="translate(20,320)">
      <rect width="270" height="42" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
      <text x="14" y="17" class="item" font-weight="700">📚 Swagger OpenAPI 3.0 (/v1/docs)</text>
      <text x="14" y="33" class="svcSub">Interactive API explorer &amp; health probe</text>
    </g>
    <text x="155" y="388" text-anchor="middle" class="deploy">☁️ Render (Production Container)</text>
  </g>

  <!-- ══ MONGODB ATLAS ══ -->
  <g transform="translate(870,270)">
    <rect class="box" width="280" height="180" rx="14" fill="url(#gDB)"/>
    <text x="140" y="32" text-anchor="middle" class="title">🍃 MongoDB Atlas</text>
    <text x="140" y="50" text-anchor="middle" class="subtitle">Native driver · Multi-doc transactions</text>
    <text x="18" y="80" class="item">• Aggregation pipelines ($lookup, $unwind)</text>
    <text x="18" y="102" class="item">• Ordered arrays: columnOrderIds, cardOrderIds</text>
    <text x="18" y="124" class="item">• Unique indexes: email, token hash</text>
    <text x="18" y="146" class="item">• Multi-document transactions (withTransaction)</text>
  </g>

  <!-- wire BE → DB -->
  <path class="wire" d="M 808 340 C 830 340, 840 340, 866 340" marker-end="url(#arrow)"/>
  <text x="838" y="328" text-anchor="middle" class="wireSub">queries</text>

  <!-- ══ INTEGRATED CLOUD & AI SERVICES ══ -->
  <g transform="translate(870,30)">
    <rect class="box" width="280" height="225" rx="14"/>
    <text x="140" y="28" text-anchor="middle" class="title">🧩 Integrated Services</text>
    <g transform="translate(16,42)">
      <rect width="248" height="38" rx="8" fill="#f5f3ff" stroke="#c084fc"/>
      <text x="12" y="16" class="svcTitle" fill="#6d28d9">✨ Google Gemini 2.5 Flash Lite</text>
      <text x="12" y="30" class="svcSub">Multimodal image vision &amp; smart task scaffolding</text>
    </g>
    <g transform="translate(16,86)">
      <rect width="248" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="16" class="svcTitle">🔑 Google OAuth 2.0</text>
      <text x="12" y="30" class="svcSub">1-click social sign-in (ID token verification)</text>
    </g>
    <g transform="translate(16,130)">
      <rect width="248" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="16" class="svcTitle">✉️ Brevo Transactional Email</text>
      <text x="12" y="30" class="svcSub">Account activation &amp; password reset tokens</text>
    </g>
    <g transform="translate(16,174)">
      <rect width="248" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="12" y="16" class="svcTitle">🖼️ Cloudinary CDN</text>
      <text x="12" y="30" class="svcSub">Card covers, attachments &amp; board wallpapers</text>
    </g>
  </g>
  <path class="wire" stroke-dasharray="4 4" d="M 808 140 C 830 140, 840 140, 866 140" marker-end="url(#arrowPurple)"/>

  <!-- ══ SUMMARY BAR ══ -->
  <g transform="translate(30,480)">
    <rect width="1120" height="150" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="24" y="32" class="title" font-size="15">🌟 Kanflow Platform Highlights</text>
    <text x="24" y="58" class="item">✓ <tspan font-weight="700">Real-Time Sync</tspan>: Instant column/card dragging &amp; live presence across multiple devices with room-isolated Socket.IO broadcasts.</text>
    <text x="24" y="80" class="item">✓ <tspan font-weight="700">Kanflow Assistant (AI)</tspan>: Context-aware assistant powered by Google Gemini 2.5 Flash Lite supporting clipboard image paste (Ctrl+V) &amp; file attachments.</text>
    <text x="24" y="102" class="item">✓ <tspan font-weight="700">Enterprise Security</tspan>: Dual-Auth (HttpOnly Cookie + Bearer fallback), Refresh Token Rotation with theft detection, IDOR validation, and 51 automated tests.</text>
    <text x="24" y="126" class="wireSub">Production Deployment: Vercel (Frontend SPA) + Render (Backend Node API) + MongoDB Atlas (Cloud Database) + Cloudinary (Media CDN).</text>
  </g>
</svg>
